name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "desktop.py"
      - "requirements.txt"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build Windows app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Sound Transfer WiFi" desktop.py

      - name: Save Windows app
        uses: actions/upload-artifact@v4
        with:
          name: sound-transfer-wifi-windows
          path: "dist/Sound Transfer WiFi.exe"
          if-no-files-found: error
          retention-days: 30
